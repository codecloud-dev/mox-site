<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>个人中心 · MoX</title>
<meta name="description" content="MoX 个人中心：更换头像、编辑昵称与简介、管理账号绑定。" />
<link rel="icon" href="favicon.svg" />
<link rel="stylesheet" href="index.css" />
<style>
  .me-wrap{max-width:720px;margin:96px auto 64px;padding:0 18px}
  .me-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .me-head h1{font-size:22px;margin:0}
  #authSlot a{color:var(--dim);font-size:14px;text-decoration:none;border:1px solid var(--stroke);padding:7px 14px;border-radius:11px;transition:.2s}
  #authSlot a:hover{color:var(--text);border-color:var(--stroke-hi)}
  .me-card{padding:28px}
  .me-card h2{font-size:15px;margin:0 0 14px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
  .me-card + .me-card{margin-top:18px}
  /* 头像 */
  .av-row{display:flex;gap:18px;align-items:center}
  .av-box{position:relative;width:96px;height:96px;border-radius:22px;overflow:hidden;flex:none;background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
  .av-box img{width:100%;height:100%;object-fit:cover;display:block}
  .av-meta{flex:1;min-width:0}
  .av-meta #avatarStatus{font-size:13px;margin:6px 0 12px;line-height:1.5}
  .st.ok{color:var(--dim)} .st.pending{color:#ffd479} .st.cooldown{color:#ff9aa9}
  .av-actions{display:flex;gap:10px;flex-wrap:wrap}
  .av-actions input[type=file]{display:none}
  .btn{display:inline-block;padding:10px 16px;border-radius:12px;border:none;background:rgba(255,255,255,.1);color:var(--text);font-weight:600;cursor:pointer;font:inherit;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn.primary{background:linear-gradient(120deg,#5eead4,#818cf8);color:#06070d}
  .btn[disabled]{opacity:.45;pointer-events:none}
  /* 基本信息 */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
  .field input,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--stroke-hi);background:rgba(255,255,255,.05);color:var(--text);font:inherit;box-sizing:border-box;resize:vertical}
  .field .hint{font-size:12px;color:var(--faint);margin-top:5px}
  .meta-line{font-size:13px;color:var(--dim);margin:4px 0}
  .meta-line b{color:var(--text);font-weight:600}
  /* 绑定 */
  .bind-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--stroke)}
  .bind-row .bi{width:64px;color:var(--dim);font-size:13px;flex:none}
  .bind-row .bn{font-weight:600}
  .bind-row .tag{font-size:11px;color:#7CFFB2;border:1px solid rgba(124,255,178,.4);padding:2px 7px;border-radius:8px;margin-left:6px}
  .bind-row .bs{margin-left:auto}
  .bind-row .bs a,.bind-row .bs button{font-size:13px;padding:6px 12px;border-radius:9px;text-decoration:none;border:1px solid var(--stroke);color:var(--dim);background:none;cursor:pointer;transition:.2s}
  .bind-row .bs a:hover,.bind-row .bs button:hover{color:var(--text);border-color:var(--stroke-hi)}
  /* 安全 */
  .sec-row{display:flex;gap:12px;align-items:center}
  .sec-row .desc{color:var(--dim);font-size:13px;flex:1}
  /* 未登录提示 */
  #loginPrompt{padding:40px 28px;text-align:center}
  #loginPrompt p{color:var(--dim);margin:0 0 18px}
  #loginPrompt .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<header class="topbar" style="position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:rgba(6,7,13,.6);border-bottom:1px solid var(--stroke)">
  <div class="me-head" style="margin:0;max-width:720px;margin:0 auto;padding:14px 18px">
    <a href="index.html" style="font-weight:800;font-size:18px;color:var(--text);text-decoration:none">MoX</a>
    <span id="authSlot"></span>
  </div>
</header>

<main class="me-wrap">
  <div class="me-head"><h1>个人中心</h1></div>

  <!-- 未登录提示 -->
  <section class="card glass" id="loginPrompt" style="display:none">
    <p>请先登录后再管理你的个人资料。</p>
    <div class="row">
      <a class="btn primary" href="index.html?redirect=me.html">前往官网登录</a>
      <button class="btn" id="localCredBtn">使用本机凭证继续</button>
    </div>
  </section>

  <!-- 个人中心面板 -->
  <div id="mePanel" style="display:none">
    <section class="card glass me-card">
      <h2>头像</h2>
      <div class="av-row">
        <div class="av-box"><img id="meAvatar" alt="头像" /></div>
        <div class="av-meta">
          <div id="avatarStatus" class="st ok">可随时更换头像（30 天冷却 · 隔天生效）</div>
          <div class="av-actions">
            <label class="btn" for="avaFile">选择图片</label>
            <input type="file" id="avaFile" accept="image/png,image/jpeg,image/webp,image/gif" />
            <button class="btn primary" id="avaApply" style="display:none">应用新头像</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card glass me-card">
      <h2>基本信息</h2>
      <div class="field">
        <label for="fName">昵称</label>
        <input id="fName" type="text" maxlength="40" placeholder="你的昵称（≤40 字）" />
      </div>
      <div class="field">
        <label for="fBio">个人简介</label>
        <textarea id="fBio" rows="3" maxlength="500" placeholder="一句话介绍你自己（≤500 字）"></textarea>
        <div class="hint">登录名 <b id="meLogin"></b> · 邮箱 <b id="meEmail"></b>（均不可修改）</div>
      </div>
      <button class="btn primary" id="saveBasic">保存修改</button>
    </section>

    <section class="card glass me-card">
      <h2>账号绑定</h2>
      <div id="bindList"></div>
    </section>

    <section class="card glass me-card">
      <h2>账户安全</h2>
      <div class="sec-row">
        <div class="desc">退出后本机凭证会保留，下次打开官网可直接登录，无需再走 GitHub / Gitee。</div>
        <button class="btn" id="logoutBtn">退出登录</button>
      </div>
    </section>
  </div>
</main>

<div id="toast" class="toast"></div>
<script src="me.js"></script>
</body>
</html>
