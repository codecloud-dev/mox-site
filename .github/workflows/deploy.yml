name: Deploy to Cloudflare Pages

# 把 mox-site 纯静态官网部署到 Cloudflare Pages（首次运行自动创建同名项目）。
# 由 GitHub Actions runner（有公网）经 wrangler 调 Cloudflare，沙箱无需直连。
#
# 诊断通道：沙箱无法下载 Actions 日志 zip，故 Deploy 步骤把 wrangler 的完整输出
# tee 到 /tmp/w.log，失败时用 gh issue 暴露（与 moxsh 的 build.yml 同一手法），
# 以便在沙箱内也能读到真实报错（多为 token 权限 / accountId 问题）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm i -g wrangler@3 2>&1 | tail -3 | tee /tmp/w.log
          echo "### wrangler whoami" | tee -a /tmp/w.log
          npx wrangler whoami 2>&1 | tee -a /tmp/w.log
          echo "### ensure project exists" | tee -a /tmp/w.log
          # wrangler pages deploy 不会自动创建项目；先建（已存在时报错可忽略）
          npx wrangler pages project create mox-site --production-branch main 2>&1 | tee -a /tmp/w.log || true
          echo "### wrangler pages deploy" | tee -a /tmp/w.log
          set +e
          npx wrangler pages deploy . --project-name=mox-site --branch=main 2>&1 | tee -a /tmp/w.log
          rc=${PIPESTATUS[0]}
          echo "DEPLOY_RC=$rc" | tee -a /tmp/w.log
          exit $rc

      - name: 部署后安全验证（安全头 + CSP + 资源完整性）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BASE=$(npx wrangler pages project list 2>/dev/null | awk '/mox-site/{for(i=1;i<=NF;i++) if($i ~ /pages\.dev/) print $i}' | head -1 | sed 's/,//')
          BASE="${BASE:-https://mox-site.pages.dev}"
          echo "验证目标: $BASE"
          S=0
          H=$(curl -sS -m 20 -D - -o /dev/null "$BASE/")
          for hdr in 'x-frame-options: DENY' 'x-content-type-options: nosniff' 'referrer-policy:' 'strict-transport-security:' 'permissions-policy:'; do
            echo "$H" | grep -qi "$hdr" && echo "OK: $hdr" || { echo "FAIL: 缺 $hdr"; S=1; }
          done
          PG=$(curl -sS -m 20 "$BASE/index.html")
          echo "$PG" | grep -q 'Content-Security-Policy' && echo "OK: CSP meta" || { echo "FAIL: index.html 缺 CSP"; S=1; }
          echo "$PG" | grep -q 'src="app.js"' && echo "OK: 外链 app.js" || { echo "FAIL: app.js 未外链"; S=1; }
          echo "$PG" | grep -q '<script>' && { echo "FAIL: 仍有内联脚本"; S=1; } || echo "OK: 无内联脚本"
          curl -sS -m 20 -o /dev/null -w '%{http_code}' "$BASE/app.js" | grep -q 200 && echo "OK: app.js 200" || { echo "FAIL: app.js 不可达"; S=1; }
          [ "$S" = 0 ] && echo "✅ 官网安全验证全绿" || {
            gh issue create --title "官网安全验证失败 $(date -u +%FT%TZ)" \
              --body "安全头/CSP/资源完整性检查未通过，见上方日志。" 2>&1 | head -2 || true; exit 1; }

      - name: 诊断失败（建 issue 暴露 wrangler 日志）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY=$(tail -c 20000 /tmp/w.log 2>/dev/null || echo "(无日志)")
          gh issue create \
            --title "Pages 部署失败 $(date -u +%FT%TZ)" \
            --body "$SUMMARY" 2>&1 | head -2 || true
