name: Deploy to Cloudflare Pages

# 把 mox-site 纯静态官网部署到 Cloudflare Pages（首次运行自动创建同名项目）。
# 鉴权用仓库 Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID），
# 由 GitHub Actions runner（有公网）经 wrangler 调 Cloudflare，沙箱无需直连。
# 注：原 cloudflare/pages-action 仓库已被官方下线（404），故改用 wrangler-action。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=mox-site --branch=main
