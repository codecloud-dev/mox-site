name: Deploy to Cloudflare Pages

# 把 mox-site 纯静态官网部署到 Cloudflare Pages（自动创建同名项目）。
# 鉴权用仓库 Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID），
# 由 GitHub Actions runner（有公网）去调 Cloudflare，沙箱无需直连。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mox-site
          # 仓库根目录即站点（index.html / style.css / *.svg 等）
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
