<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 · MoX</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="dark">
<style>
  :root{--bg:#06070d;--t:#e8ecf7;--sub:#98a2bd;--accent:#6ea8ff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--t);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;text-align:center;padding:24px}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:20px;
    padding:48px 40px;max-width:440px;backdrop-filter:blur(14px)}
  .code{font-size:64px;font-weight:700;background:linear-gradient(135deg,var(--accent),#b07dff);
    -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
  h1{font-size:20px;margin:12px 0 8px}
  p{color:var(--sub);font-size:14px;line-height:1.7;margin-bottom:24px}
  a{display:inline-block;padding:11px 26px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600;
    color:#0b1020;background:linear-gradient(135deg,#7db2ff,#a88bff)}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <h1>页面不存在</h1>
  <p>你要找的页面不存在，或已被移动。<br>如果你打开的是管理后台地址，请核对秘径是否输入完整。</p>
  <a href="/">返回 MoX 首页</a>
</div>
</body>
</html>
